<div class="movies-container">
    <!-- ! ====== Filters Section ====== -->
    <section class="filters-section">
        <div class="filters-container">
            <label for="filter-select">Sort by:</label>
            
            <!-- ? --- Relevance Filter --- -->
            <select 
                id="filter-select" 
                class="filter-dropdown" 
                [(ngModel)]="selectedFilter" 
                (ngModelChange)="onFilterChange($event)">
                <option value="relevance">Relevance</option>
                <option value="popular">Popular</option>
                <option value="recent">Recent</option>
                <option value="upcoming">Upcoming</option>
            </select>

            <!-- ? --- Genre Filter --- -->
            <label for="genre-select">Genre:</label>
            <select 
                id="genre-select" 
                class="filter-dropdown" 
                [(ngModel)]="selectedGenre" 
                (ngModelChange)="onGenreChange($event)">
                <option [ngValue]="null">All Genres</option>
                @for (genre of genresList; track genre.id) {
                    <option [ngValue]="genre.id">
                        {{ genre.name }}
                    </option>
                }
            </select>

            <!-- ? --- Year Filter --- -->
            <label for="year-select">Year:</label>
            <select 
                id="year-select" 
                class="filter-dropdown" 
                [(ngModel)]="selectedYear" 
                (ngModelChange)="onYearChange($event)">
                <option value="">All Years</option>
                @for (year of yearsList; track year) {
                    <option [value]="year.toString()">
                        {{ year }}
                    </option>
                }
            </select>
        </div>
    </section>
    
    <!-- ! === Movies Section === -->
    <section class="movies-section">
        @for (movie of movies; track movie.id) {
            <!-- ? --- Movie Card --- -->
            <app-movie-card [movie]="movie" />
        }
    </section>

    <!-- ? --- Loading Spinner --- -->
    @if (isLoading) {
        <div class="loading-indicator">
            <div class="spinner"></div>
            <span>Loading more movies...</span>
        </div>
    }

    <!-- ? --- Button to Top --- -->
    @if (showScrollTopBtn) {
        <button class="scroll-top-btn" (click)="scrollToTop()" aria-label="Scroll to top">
            <img src="assets/img/buttons-icons/arrow-button.png" alt="Scroll to top"/>
        </button>
    }

</div>
