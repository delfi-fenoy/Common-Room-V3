<div class="auth-container">
    <app-modal />

    <!-- ? --- Background Stars --- -->
    <div class="stars"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <!-- ? --- Botón de Retorno a Inicio --- -->
    <div class="back-button" routerLink="/" title="Go to home">
        <img src="assets/img/CR-icon2.png" alt="App logo" class="logo-img" />
    </div>

    <!-- * ========== Formulario de Inicio de Sesión ========== -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <h1 class="auth-title">Login</h1>

        <!-- Mensaje de Error de Acceso -->
        @if (loginError()) {
            <div class="error-message">Invalid access. Please try again.</div>
        }

        <!-- Subsección: Campo Usuario -->
        <div class="field-container">
            <label for="username">Username</label>
            <input type="text" id="username" formControlName="username" autocomplete="username" />
        </div>

        <!-- Subsección: Campo Contraseña -->
        <div class="field-container">
            <label for="password">Password</label>
            <div class="password-field">
                <input
                    [type]="showPassword() ? 'text' : 'password'"
                    id="password"
                    formControlName="password"
                    autocomplete="current-password"
                />
                <button
                    type="button"
                    class="toggle-password-btn"
                    (click)="togglePassword()"
                    [title]="showPassword() ? 'Hide password' : 'Show password'"
                >
                    {{ showPassword() ? 'Hide' : 'Show' }}
                </button>
            </div>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" [disabled]="loginForm.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Logging in...' : 'Login' }}
        </button>

        <!-- Navegación a Registro -->
        <p class="auth-switch">
            Don't have an account?
            <a routerLink="/register">Register</a>
        </p>
    </form>
</div>
