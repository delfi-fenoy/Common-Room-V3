<!-- ? --- Fondo Oscuro / Backdrop --- -->
<div class="sidebar-overlay" [class.active]="isOpen" (click)="closeSidebar()"></div>

<!-- ? --- Contenedor Principal del Sidebar --- -->
<aside class="sidebar" [class.open]="isOpen">
    <!-- ! ====== Encabezado del Sidebar ====== -->
    <div class="sidebar-header">
        <div class="sidebar-title">
            <img src="assets/img/CR-icon1.png" alt="Common Room Logo" class="logo-img" />
        </div>

        <!-- ? --- Botón de Cerrar --- -->
        <button class="close-btn" (click)="closeSidebar()" aria-label="Cerrar menú">
            <img src="assets/img/buttons-icons/close-button.png" alt="Close" class="buttons-img" />
        </button>
    </div>

    <hr class="sidebar-divider" />

    <!-- ! ====== Lista de Navegación ====== -->
    <nav class="sidebar-nav">
        <!-- ? --- Movies List Button --- -->
        <a routerLink="/movies" class="nav-btn" (click)="closeSidebar()">
            <img
                src="assets/img/buttons-icons/movies-button.png"
                alt="Movies"
                class="buttons-img"
            />
            <span>Movies</span>
        </a>

        <!-- ? --- Users List Button --- -->
        <a routerLink="/users" class="nav-btn" (click)="closeSidebar()">
            <img src="assets/img/buttons-icons/users-button.png" alt="Users" class="buttons-img" />
            <span>Users</span>
        </a>

        <!-- ? --- Playlists List Button --- -->
        <a routerLink="/playlists" class="nav-btn" (click)="closeSidebar()">
            <img
                src="assets/img/buttons-icons/playlists-button.png"
                alt="Playlists"
                class="buttons-img"
            />
            <span>Playlists</span>
        </a>

        <!-- ! --- ADMIN BAN USER LIST Button (Exclusivo Admin) --- -->
        @if (isAdmin()) {
            <button class="nav-btn" (click)="openBanModal()">
                <img src="assets/img/buttons-icons/users-button.png" alt="Bans" class="buttons-img" />
                <span>Banned Users</span>
            </button>
        }
    </nav>
</aside>

<!-- ! ====== Modal de Baneos Autónomo en el Sidebar ====== -->
@if (modalService.isOpen() && modalService.type() === 'ban') {
    <app-ban-modal></app-ban-modal>
}
