<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Metadatos básicos -->
    <title>Common Room</title>
    <base href="/" />
    <meta name="author" content="Fenoy Rivas Delfina, Francano Ian, Perez Lola" /> 
    <!-- <----- Update: Descripción y keywords traducidas al inglés ----->
    <meta name="description" content="Social network for movie lovers. Sign up, discover movies, share reviews, rate titles, and create your own lists integrated with TMDB." />
    <meta name="keywords" content="movies, cinema, reviews, ratings, social network, movie lists, TMDB, common room" />
    <meta name="theme-color" content="#121212" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Common Room - Movie Social Network" />
    <meta property="og:description" content="Discover movies, share reviews, and rate your favorite productions." />
    <meta property="og:image" content="/assets/img/CR-icon1.png" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/img/CR-icon1.png" type="image/png" />
