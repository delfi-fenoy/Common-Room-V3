<div class="auth-container">
    <!-- ? Background Stars -->
    <div class="stars"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <!-- ? --- Button Home --- -->
    <div class="back-button" routerLink="/" title="Go to home">
        <img src="assets/img/CR-icon2.png" alt="App logo" class="logo-img" />
    </div>

    <!-- ! ====== Form Login ====== -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <h1 class="auth-title">Login</h1>

        <!-- ! === Error Message === -->
        @if (loginError()) {
            <div class="error-message">Invalid access. Please try again.</div>
        }

        <!-- ? --- Username Input --- -->
        <div class="field-container">
            <label for="username">Username</label>
            <input type="text" id="username" formControlName="username" autocomplete="username" />
        </div>

        <!-- ? --- Password Input --- -->
        <div class="field-container">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                formControlName="password"
                autocomplete="current-password"
            />
        </div>

        <!-- ? --- Button Submit --- -->
        <button type="submit" [disabled]="loginForm.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Logging in...' : 'Login' }}
        </button>

        <!-- ? ----- Go to Register ----- -->
        <p class="auth-switch">
            Don't have an account?
            <a routerLink="/register">Register</a>
        </p>
    </form>
</div>
